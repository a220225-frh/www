<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My Personal Pages</title>
  <style>
    body {
     background: linear-gradient(135deg, #fff0f5, #ffe4ef);
    }
    #header {
      background-color: #d66b9c;
      padding: 20px;
      text-align: center;
    }
    #title {
      color: #fff5fa ;
      font-size: 30px;
      letter-spacing: 1px;
      font-weight: 700;
      text-shadow: 1px 2px 3px rgba(90, 58, 74, 0.3);
      margin: 0;
    }
    #menu {
      background-color: #ffe4ef ;
      padding: 10px;
      border-bottom: 2px solid #f3b6cf;
    }
    #menu a {
      color: #b83b72;
      font-weight: bold;
      margin: 0 8px;
    }
    #menu a:hover {
      color: #d66b9c;
      background-color: #fff0f5;
      padding: 5px;
    }
    #iframe {
      width: 100%;
      height: 40px;
      border: none;
    }
    #content {
      background-color: #ffffff;
      border-radius: 15px;
      color: #5a3a4a;
      box-shadow: 0 4px 12px rgba(90, 58, 74, 0.15);
      padding: 20px;
      min-height: 200px;
      text-align: center;
    }
    #content p {
      font-size: 17px;
      line-height: 1.6;
      color: #8a526b;
    }
    #welcome {
      margin-bottom: 10px;
    }
    #footer {
      background-color: #d66b9c ;
      color: #fff5fa;
      height: 50px;
      line-height: 50px;
      text-align: center;
    }
    #footnote {
      font-weight: bold;
      font-size: 14px;
    }
    .flowers {
      animation: float 3s ease-in-out infinite;
    }
    #footnote {
  font-weight: bold;
  font-size: 14px;
}

.flowers {
  animation: float 3s ease-in-out infinite;
  font-size: 25px;
  margin-bottom: 8px;
}

@keyframes float {
  0% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-8px);
  }

  100% {
    transform: translateY(0);
  }
}
  </style>
</head>
<body>
 
<div id="header">
  
<div class="flowers">🌸 🌷 🌸</div>

  <h1 id="title">My Personal Pages</h1>
</div>
 
<div id="menu">
  <iframe id="iframe" src="menu.html" title="Menu"></iframe>
</div>
 
<div id="content">

  <h2 id="welcome">✨ Welcome To My Personal Space ✨</h2>
  <br>
  <p>Please click the above menu 😄.</p>
</div>
 
<div id="footer">
  <span id="footnote">Web Programming @ UKM ™</span>
</div>
 
</body>
</html>
